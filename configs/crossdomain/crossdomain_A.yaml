# Cross-domain continual forecasting, order A: elec -> ettm1 -> traffic -> weather -> etth1
data:
  seq_len: 96
  pred_len: 48
  domains:
  - csv: electricity.csv
    column: OT
    length: 12000
  - csv: ETTm1.csv
    column: OT
    length: 12000
  - csv: traffic.csv
    column: OT
    length: 12000
  - csv: weather.csv
    column: OT
    length: 12000
  - csv: ETTh1.csv
    column: OT
    length: 12000
backbone:
  d_model: 128
  d_state: 16
  d_conv: 4
  expand: 2
  n_layers: 2
  dropout: 0.2
model:
  use_revin: true
ewc:
  lambda_ewc: 1000.0
replay:
  capacity: 500
si:
  lambda_si: 1.0
  epsilon: 0.1
derpp:
  capacity: 500
  alpha: 0.5
  beta: 0.5
clser:
  capacity: 500
  reg_weight: 0.1
  plastic_model_alpha: 0.99
  stable_model_alpha: 0.999
  plastic_model_update_freq: 0.9
  stable_model_update_freq: 0.7
training:
  epochs_per_regime: 50
  batch_size: 32
  learning_rate: 0.0002
  weight_decay: 0.0005
  grad_clip: 1.0
  seed: 42
  num_workers: 2
  checkpoint_dir: checkpoints/continual
ifr:
  capacity: 500
  kappa: 4.0
  weight: 1.0
spectracl:
  capacity: 500
  n_fft_fingerprint: 16
  fdrl_weight: 0.3
  siar_temperature: 0.5
  siar_mse_weight: 0.2
  use_raw_replay: true
  raw_replay_capacity: 300
  raw_replay_weight: 1.0
  sfr_weight: 0.2
  sfr_n_probes: 32
  sfr_interval: 3
  use_csd: true
  csd_blend: 0.3
  use_hint_loss: true
  hint_weight: 0.4
  hint_decay: 0.7
  hint_interval: 3
  use_sgbd: true
  sgbd_protection_strength: 0.45
  sgbd_min_scale: 0.1
  use_nsp: false
  use_fpsp: false
  protection_ratio: 0.2
  partition_criterion: decay_rate
  covariance_ema: 0.95
  null_space_threshold: 0.99
  min_freedom_ratio: 0.3
  covariance_task_decay: 0.95
  adaptive_protection: false
  adaptive_sensitivity: 2.0
  use_ewc: true
  ewc_lambda: 30.0
  lr_decay_per_task: 0.95
mas:
  lambda_mas: 1.0
fsnet:
  gamma: 0.9
  gamma_prime: 0.99
  memory_capacity: 32
  trigger_threshold: 0.1
  adapt_lr: 0.01
adaptivecl:
  capacity: 500
  soft_capacity: 64
  memory_batch_size: 32
  soft_batch_size: 16
  alpha: 0.5
  beta: 0.5
  gamma: 0.5
